spring.application.name=mentimeter
spring.datasource.url=jdbc:postgresql://localhost:5432/polling_app
spring.datasource.username=ken
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.hikari.maximum-pool-size=30

# Kafka (Aiven, SASL_SSL). KAFKA_USERNAME / KAFKA_PASSWORD must be set as
# environment variables locally / in the deployment secrets - never commit them.
spring.kafka.bootstrap-servers=kafka-bae772b-tangkenyi2001-3df3.c.aivencloud.com:21723
spring.kafka.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-512
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";
# Aiven's Kafka SASL_SSL listener presents a cert signed by its project CA,
# not a public CA - trust it via a truststore built from that CA cert
# (backend/src/main/resources/kafka/aiven-kafka-ca.pem). The truststore
# password just protects integrity of a public cert, not a secret.
spring.kafka.ssl.trust-store-location=classpath:kafka/kafka.truststore.p12
spring.kafka.ssl.trust-store-password=aiven-kafka-ca
spring.kafka.ssl.trust-store-type=PKCS12

spring.kafka.consumer.group-id=${spring.application.name}-${random.uuid}
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.mentimeter.dto

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

mentimeter.kafka.poll-vote-events-topic=poll-vote-events